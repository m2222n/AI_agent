# Alembic 설정 — 사용자 DB(users/watchlists/paper_* 등) 스키마 마이그레이션.
# sqlalchemy.url은 여기서 비워두고 alembic/env.py가 config.DATABASE_URL로 채운다
# (dev=sqlite, prod=postgres 동일 코드 경로). 부팅 시 api/db.py:run_migrations가
# 프로그램적으로 실행하므로 CLI(alembic upgrade)는 로컬 개발/CI에서만 쓴다.

[alembic]
script_location = alembic
prepend_sys_path = .
# env.py가 config에서 오버라이드하므로 플레이스홀더(빈 값이면 CLI가 에러라 dummy).
sqlalchemy.url = sqlite:///alembic_placeholder.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
