name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'ETF_RAG/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'ETF_RAG/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ETF_RAG/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r ETF_RAG/requirements.txt
          # 수집 모듈 전용 의존성 (배포 앱엔 불필요해 requirements.txt 제외).
          # collector/stock_collector 테스트가 import하므로 CI에선 설치.
          pip install pykrx requests
          pip install pytest-cov

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/ETF_RAG
          OPENAI_API_KEY: "sk-test-dummy-key-for-ci"
        run: |
          cd ETF_RAG
          python -m pytest tests/ \
            --cov=src --cov=config \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            -q --tb=short

      - name: Check coverage threshold
        if: always()
        run: |
          cd ETF_RAG
          if [ -f coverage.json ]; then
            TOTAL=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
            echo "### Test Coverage: ${TOTAL}%" >> $GITHUB_STEP_SUMMARY
            echo "Total coverage: ${TOTAL}%"
          fi

      # Alembic drift 게이트 — 모델 정의와 마이그레이션 리비전이 일치하는지.
      # 빈 sqlite에 upgrade head 후 alembic check가 diff를 감지하면 실패
      # (= 모델은 바꿨는데 리비전 안 만든 drift). 테스트는 create_all을 쓰므로
      # 이 게이트가 "테스트 경로 == 프로덕션 마이그레이션 경로" 정합을 보장한다.
      - name: Alembic migration drift check
        env:
          PYTHONPATH: ${{ github.workspace }}/ETF_RAG
          OPENAI_API_KEY: "sk-test-dummy-key-for-ci"
          DATABASE_URL: "sqlite:////tmp/ci_alembic.db"
        run: |
          cd ETF_RAG
          rm -f /tmp/ci_alembic.db
          alembic upgrade head
          alembic check

  # RAG 검색 품질 게이트 — retrieval Hit Rate가 임계 미만이면 실패(검색 회귀 감지).
  # OPENAI_API_KEY는 FAISS 인덱싱(임베딩)에 필요 → secret 있을 때만 실행, 없으면 skip.
  # RAGAS full(답변 품질)은 비용·비결정성으로 CI 제외 — 로컬에서 run_eval.py로 측정.
  rag-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # eval/retriever/데이터 변경 시에만 (테스트와 별개로 트리거 좁힘)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check OPENAI_API_KEY presence
        id: key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "has_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "OPENAI_API_KEY secret 미설정 — RAG 게이트 skip(설정 시 자동 활성화)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Set up Python
        if: steps.key.outputs.has_key == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ETF_RAG/requirements.txt

      - name: Install system dependencies
        if: steps.key.outputs.has_key == 'true'
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum

      - name: Install Python dependencies
        if: steps.key.outputs.has_key == 'true'
        run: |
          pip install --upgrade pip
          pip install -r ETF_RAG/requirements.txt

      - name: Run retrieval Hit Rate gate
        if: steps.key.outputs.has_key == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}/ETF_RAG
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd ETF_RAG
          # --no-llm: RAGAS(유료 GPT) 없이 검색만. --min-hit-rate: 임계 미만이면 exit 1.
          python eval/run_eval.py --no-llm --min-hit-rate 0.90 | tee eval_out.txt
          echo "### RAG 검색 게이트" >> $GITHUB_STEP_SUMMARY
          grep -E "Hit Rate|게이트" eval_out.txt >> $GITHUB_STEP_SUMMARY || true
