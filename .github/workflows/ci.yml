name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'ETF_RAG/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'ETF_RAG/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ETF_RAG/requirements.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r ETF_RAG/requirements.txt
          # 수집 모듈 전용 의존성 (배포 앱엔 불필요해 requirements.txt 제외).
          # collector/stock_collector 테스트가 import하므로 CI에선 설치.
          pip install pykrx requests
          pip install pytest-cov

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/ETF_RAG
          OPENAI_API_KEY: "sk-test-dummy-key-for-ci"
        run: |
          cd ETF_RAG
          python -m pytest tests/ \
            --cov=src --cov=config \
            --cov-report=term-missing \
            --cov-report=json:coverage.json \
            -q --tb=short

      - name: Check coverage threshold
        if: always()
        run: |
          cd ETF_RAG
          if [ -f coverage.json ]; then
            TOTAL=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
            echo "### Test Coverage: ${TOTAL}%" >> $GITHUB_STEP_SUMMARY
            echo "Total coverage: ${TOTAL}%"
          fi
