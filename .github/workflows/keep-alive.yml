name: Keep Services Alive

# 무료 호스팅 서비스들의 유휴 비활성화 방지용 ping
# - Streamlit Cloud: 7일 무활동 시 비활성화
# - Supabase: 7일 무활동 시 일시정지
# 매일 09:00 KST(00:00 UTC) ping을 보내 카운트를 리셋한다.
#
# ⚠️ 한계 (2026-06-08 확인):
#   1. Streamlit sleep 해제는 본질적으로 브라우저 WebSocket 세션이 필요하다.
#      단순 HTTP ping은 health 엔드포인트를 건드려 활동 신호를 보내지만 100% 보장은 아니다.
#   2. 앱이 인증(share.streamlit.io/-/auth) 뒤에 있으면 모든 ping이 로그인 redirect로
#      막혀 무효가 된다. 반드시 앱을 Public으로 설정해야 ping이 실제 앱에 도달한다.
#      → 이 워크플로우는 auth redirect를 감지하면 경고를 출력한다.

on:
  schedule:
    # 매일 00:00 UTC = 09:00 KST
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Streamlit app
        continue-on-error: true
        run: |
          BASE="https://aiagent-5ejryv4fsnjvhrevzwn3ct.streamlit.app"
          echo "=== Streamlit keep-alive ping ==="

          # 1) 루트로 첫 응답 확인 — auth 게이트 뒤에 있는지 감지 (redirect 따라가지 않음)
          LOC=$(curl -sS --max-time 30 -o /dev/null -D - "$BASE/" 2>/dev/null \
                | grep -i '^location:' | tr -d '\r' | head -1 || echo "")
          if echo "$LOC" | grep -qi '/-/auth'; then
            echo "::warning::앱이 인증 게이트 뒤에 있습니다 ($LOC). ping이 무효화됩니다."
            echo "→ Streamlit Cloud 대시보드에서 앱을 Public으로 설정하세요."
          fi

          # 2) health 엔드포인트 ping (redirect 1회만 허용) — 깨어있는 컨테이너의 health check
          HEALTH=$(curl -sS --max-time 30 --max-redirs 1 -L \
                   -o /tmp/health.txt -w "%{http_code}" "$BASE/_stcore/health" 2>/dev/null || echo "000")
          BODY=$(head -c 50 /tmp/health.txt 2>/dev/null || echo "")
          echo "health: HTTP $HEALTH, body='$BODY'"

          # 3) 루트 ping (활동 카운트 리셋 시도)
          ROOT=$(curl -sS --max-time 30 -o /dev/null -w "%{http_code}" "$BASE/" 2>/dev/null || echo "000")
          echo "root:   HTTP $ROOT"

          # 깨어있고 public이면 health가 "ok" 반환. auth/sleep이면 redirect(3xx) 또는 비-ok.
          if [ "$BODY" = "ok" ]; then
            echo "✅ Streamlit 앱 정상 (health=ok) — 활동 신호 전달됨"
          elif [ "$HEALTH" = "000" ] && [ "$ROOT" = "000" ]; then
            echo "::warning::Streamlit 무응답 — 서버 다운 가능성"
          else
            echo "::warning::health!=ok (HTTP $HEALTH). auth 게이트 또는 sleep 상태일 수 있음 — 위 경고 확인."
          fi

      - name: Ping Supabase REST API
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "SUPABASE_URL/KEY secret 미설정 — Supabase ping 건너뜀"
            exit 0
          fi
          # 빈 select로 가벼운 read 1회 — 활동 카운트 리셋용
          echo "Pinging Supabase: $SUPABASE_URL"
          curl -sS --max-time 15 \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -o /dev/null -w "HTTP %{http_code} (%{time_total}s)\n" \
            "$SUPABASE_URL/rest/v1/visitor_stats?select=count&limit=1" \
            || echo "Supabase ping 실패 (무시)"
