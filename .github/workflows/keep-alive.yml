name: Keep Services Alive

# 무료 호스팅 서비스들의 유휴 비활성화 방지용 ping
# - Streamlit Cloud: 7일 무활동 시 비활성화
# - Supabase: 7일 무활동 시 일시정지
# 매일 09:00 KST(00:00 UTC) ping을 보내 카운트를 리셋한다.

on:
  schedule:
    # 매일 00:00 UTC = 09:00 KST
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Streamlit app
        continue-on-error: true
        run: |
          URL="https://aiagent-5ejryv4fsnjvhrevzwn3ct.streamlit.app/"
          echo "Pinging Streamlit: $URL"
          # Streamlit Cloud는 슬립 상태일 때 깨우는 동안 redirect 체인이 길어
          # curl -L의 기본 redirect 한도(50)에 걸릴 수 있다. redirect 따라가지 않고
          # 첫 응답만 받아도 활동 카운트는 리셋된다.
          STATUS=$(curl -sS --max-time 30 -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          echo "HTTP $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "Streamlit ping 실패 — 서버 응답 없음"
          else
            echo "Streamlit ping 성공 — 서버 응답 받음 (활동 카운트 리셋)"
          fi

      - name: Ping Supabase REST API
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "SUPABASE_URL/KEY secret 미설정 — Supabase ping 건너뜀"
            exit 0
          fi
          # 빈 select로 가벼운 read 1회 — 활동 카운트 리셋용
          echo "Pinging Supabase: $SUPABASE_URL"
          curl -sS --max-time 15 \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -o /dev/null -w "HTTP %{http_code} (%{time_total}s)\n" \
            "$SUPABASE_URL/rest/v1/visitor_stats?select=count&limit=1" \
            || echo "Supabase ping 실패 (무시)"
