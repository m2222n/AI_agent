name: Daily KRX Data Collection

on:
  schedule:
    # 18:30 KST = 09:30 UTC (월~금)
    # KRX 장마감 15:30 → 결산 ~17:30 → 안전 마진 1시간
    - cron: '30 9 * * 1-5'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pykrx requests

      - name: Collect KRX data and update deploy/
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          python scripts/collect_for_deploy.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet ETF_RAG/src/data/deploy/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +%Y%m%d)
          git add ETF_RAG/src/data/deploy/etf_data.json ETF_RAG/src/data/deploy/stock_data.json
          git commit -m "chore: update deploy data ($DATE)

          Automated daily KRX data collection via GitHub Actions"
          git push
