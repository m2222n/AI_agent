name: Daily KRX Data Collection

on:
  schedule:
    # 18:30 KST = 09:30 UTC (매일, 주말 포함)
    # 주말/공휴일에도 실행 — 비영업일이면 직전 영업일 데이터 재확인 (누락 방지)
    - cron: '30 9 * * *'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pykrx requests dart-fss python-dotenv

      # 월요일(KST) 여부 판정 — 재무제표 수집 + 타임아웃 조정에 사용
      - name: Check if Monday (KST)
        id: day_check
        run: |
          KST_DAY=$(TZ=Asia/Seoul date +%u)  # 1=월 ... 7=일
          echo "kst_weekday=$KST_DAY" >> $GITHUB_OUTPUT
          if [ "$KST_DAY" = "1" ]; then
            echo "is_monday=true" >> $GITHUB_OUTPUT
            echo "KST 월요일 — 재무제표 수집 포함"
          else
            echo "is_monday=false" >> $GITHUB_OUTPUT
            echo "KST $(TZ=Asia/Seoul date +%A) — 재무제표 생략"
          fi

      # ── DB 다운로드 (Release asset에서) ──────────────────────
      - name: Download DB from latest release
        id: download_db
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DB_DIR="ETF_RAG/src/data"
          mkdir -p "$DB_DIR"

          # 최신 release에서 DB 다운로드
          if gh release download db-latest \
              --pattern "etf_rag.db.zst" \
              --dir /tmp \
              --clobber 2>/dev/null; then
            echo "DB 다운로드 성공"
            # zstd 압축 해제 (ubuntu-latest에 zstd 기본 포함)
            zstd -d /tmp/etf_rag.db.zst -o "$DB_DIR/etf_rag.db" --force
            ls -lh "$DB_DIR/etf_rag.db"
            echo "db_exists=true" >> $GITHUB_OUTPUT
          else
            echo "DB release 없음 — DB 수집 건너뜀"
            echo "db_exists=false" >> $GITHUB_OUTPUT
          fi

      # ── 데이터 수집 (deploy JSON + DB) ──────────────────────
      - name: Collect KRX data
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}/ETF_RAG:${{ github.workspace }}/scripts
        run: |
          # 최대 3회 재시도 (KRX 간헐적 장애 대응)
          SKIP_DB_FLAG=""
          if [ "${{ steps.download_db.outputs.db_exists }}" != "true" ]; then
            SKIP_DB_FLAG="--skip-db"
          fi

          for attempt in 1 2 3; do
            echo "=== 수집 시도 $attempt/3 ==="
            if python scripts/collect_full.py $SKIP_DB_FLAG; then
              echo "수집 성공"
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "실패 — 60초 후 재시도"
              sleep 60
            else
              echo "3회 모두 실패"
              exit 1
            fi
          done

      # ── DB 업로드 (Release asset으로) ───────────────────────
      - name: Upload DB to release
        if: steps.download_db.outputs.db_exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DB_FILE="ETF_RAG/src/data/etf_rag.db"
          if [ -f "$DB_FILE" ]; then
            zstd -19 "$DB_FILE" -o /tmp/etf_rag.db.zst --force
            COMPRESSED_SIZE=$(du -h /tmp/etf_rag.db.zst | cut -f1)
            echo "DB 압축 완료: $COMPRESSED_SIZE"

            # release가 없으면 생성
            if ! gh release view db-latest > /dev/null 2>&1; then
              gh release create db-latest \
                --title "SQLite DB (자동 업데이트)" \
                --notes "매일 GitHub Actions에서 자동 업데이트되는 SQLite DB" \
                --latest=false
            fi

            # asset 업로드 (기존 파일 덮어쓰기)
            gh release upload db-latest /tmp/etf_rag.db.zst --clobber
            echo "DB 업로드 완료"
          fi

      # ── deploy/ JSON 커밋 ───────────────────────────────────
      - name: Check for changes
        id: changes
        run: |
          git diff --quiet ETF_RAG/src/data/deploy/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(TZ=Asia/Seoul date +%Y%m%d)
          git add ETF_RAG/src/data/deploy/etf_data.json ETF_RAG/src/data/deploy/stock_data.json
          git commit -m "chore: update deploy data ($DATE KST)

          Automated daily KRX data collection via GitHub Actions"
          git push

  # ── 실패 시 GitHub Issue 자동 생성 ──────────────────────
  notify-failure:
    runs-on: ubuntu-latest
    needs: collect
    if: failure()
    steps:
      - name: Create failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          # 동일 날짜 이슈 중복 방지
          EXISTING=$(gh issue list \
            --repo ${{ github.repository }} \
            --search "Data collection failed ($DATE)" \
            --state open --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create \
              --repo ${{ github.repository }} \
              --title "🚨 Data collection failed ($DATE)" \
              --body "Daily KRX data collection failed on $DATE.

          [View workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          This issue was created automatically." \
              --label "bug"
          fi
