name: Daily KRX Data Collection

on:
  schedule:
    # 18:30 KST = 09:30 UTC (월~금)
    # KRX 장마감 15:30 → 결산 ~17:30 → 안전 마진 1시간
    - cron: '30 9 * * 1-5'
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pykrx requests dart-fss

      - name: Collect KRX data and update deploy/
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          # 최대 3회 재시도 (KRX 간헐적 장애 대응)
          for attempt in 1 2 3; do
            echo "=== 수집 시도 $attempt/3 ==="
            if python scripts/collect_for_deploy.py; then
              echo "수집 성공"
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "실패 — 60초 후 재시도"
              sleep 60
            else
              echo "3회 모두 실패"
              exit 1
            fi
          done

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet ETF_RAG/src/data/deploy/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATE=$(date -u +%Y%m%d)
          git add ETF_RAG/src/data/deploy/etf_data.json ETF_RAG/src/data/deploy/stock_data.json
          git commit -m "chore: update deploy data ($DATE)

          Automated daily KRX data collection via GitHub Actions"
          git push
